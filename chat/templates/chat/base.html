
{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chatroom{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

  :root {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --primary: #536dfe;
    --primary-dark: #4055e8;
    --text: #172033;
    --muted: #7b8498;
    --border: #e8ebf2;
    --success: #16b981;
    --shadow: 0 12px 40px rgba(25, 40, 80, 0.06);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  button, input {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  /* NAVBAR */

  .topbar {
    height: 76px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .topbar-inner {
    max-width: 1120px;
    height: 100%;
    margin: auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text);
    font-size: 21px;
    font-weight: 800;
  }

  .brand-icon {
    width: 38px;
    height: 38px;
    background: var(--primary);
    color: white;
    border-radius: 11px;
    display: grid;
    place-items: center;
    font-size: 24px;
  }

  .nav-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--muted);
  }

  /* PAGE */

  .page {
    max-width: 1120px;
    margin: 45px auto;
    padding: 0 24px;
  }

  .eyebrow {
    color: var(--primary);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
  }

  .muted {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
  }

  /* BUTTONS */

  .button {
    border: none;
    border-radius: 10px;
    background: var(--primary);
    color: white;
    padding: 13px 20px;
    font-weight: 700;
    transition: 0.2s ease;
  }

  .button:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
  }

  .button span {
    margin-left: 8px;
  }

  /* WELCOME SECTION */

  .welcome-card {
    min-height: 370px;
    background: #111c36;
    border-radius: 20px;
    padding: 45px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    overflow: hidden;
    color: white;
  }

  .welcome-content {
    max-width: 490px;
    position: relative;
    z-index: 2;
  }

  .welcome-card .eyebrow {
    color: #a5b4fc;
  }

  .live-dot,
  .preview-online {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: #34d399;
    border-radius: 50%;
    margin-right: 6px;
  }

  .welcome-card h1 {
    font-size: clamp(30px, 4vw, 43px);
    line-height: 1.2;
    margin: 20px 0 12px;
    letter-spacing: -1.5px;
  }

  .welcome-card .muted {
    color: #aab4c9;
    max-width: 400px;
  }

  /* USERNAME FORM */

  .username-form {
    display: flex;
    gap: 10px;
    margin-top: 25px;
    align-items: flex-end;
  }

  .input-group {
    flex: 1;
  }

  .input-group label {
    display: block;
    font-size: 10px;
    color: #aab4c9;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .username-form input {
    width: 100%;
    padding: 14px;
    border: 1px solid #34415d;
    background: #1c2945;
    color: white;
    border-radius: 10px;
    outline: none;
  }

  .username-form input:focus {
    border-color: #8494ff;
  }

  .username-form input::placeholder {
    color: #8b96ad;
  }

  .privacy-note {
    color: #aab4c9;
    font-size: 12px;
    margin-top: 18px;
  }

  .privacy-note span {
    color: #34d399;
    margin-right: 5px;
  }

  /* WELCOME DECORATION */

  .welcome-decoration {
    width: 340px;
    height: 250px;
    position: relative;
    display: grid;
    place-items: center;
  }

  .decoration-circle {
    position: absolute;
    border: 1px solid #34415d;
    border-radius: 50%;
  }

  .circle-one {
    width: 290px;
    height: 290px;
  }

  .circle-two {
    width: 220px;
    height: 220px;
  }

  .chat-preview {
    width: 280px;
    padding: 18px;
    background: #fff;
    color: var(--text);
    border-radius: 15px;
    position: relative;
    z-index: 1;
    box-shadow: 0 15px 50px rgba(0, 0, 0, .25);
  }

  .preview-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 13px;
    border-bottom: 1px solid var(--border);
  }

  .preview-avatar {
    width: 35px;
    height: 35px;
    border-radius: 10px;
    background: #e8ecff;
    color: var(--primary);
    display: grid;
    place-items: center;
    font-weight: 800;
  }

  .preview-header strong,
  .preview-header small {
    display: block;
    font-size: 12px;
  }

  .preview-header small {
    color: var(--muted);
    margin-top: 3px;
    font-size: 10px;
  }

  .preview-online {
    margin-left: auto;
  }

  .preview-message {
    background: #f0f2ff;
    padding: 10px;
    border-radius: 9px;
    font-size: 11px;
    margin-top: 13px;
    width: fit-content;
  }

  .preview-reply {
    background: #eafaf3;
    margin-left: auto;
  }

  .preview-input {
    margin-top: 16px;
    padding: 10px;
    background: #f5f6fa;
    color: var(--muted);
    border-radius: 8px;
    font-size: 11px;
  }

  /* DASHBOARD */

  .dashboard-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin: 50px 0 22px;
  }

  .dashboard-head h2 {
    font-size: 25px;
    margin: 7px 0;
    letter-spacing: -0.7px;
  }

  .create-room {
    display: flex;
    gap: 9px;
  }

  .create-room input {
    width: 200px;
    padding: 12px 14px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    outline: none;
    font-size: 13px;
  }

  .create-room input:focus {
    border-color: var(--primary);
  }

  /* ROOM CARDS */

  .room-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 15px;
  }

  .room-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 19px;
    display: flex;
    align-items: center;
    gap: 15px;
    transition: 0.2s ease;
  }

  .room-card:hover {
    border-color: #b9c3ff;
    transform: translateY(-3px);
    box-shadow: var(--shadow);
  }

  .room-icon {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    background: #eef0ff;
    color: var(--primary);
    border-radius: 11px;
    display: grid;
    place-items: center;
    font-size: 24px;
    font-weight: 700;
  }

  .room-info {
    flex: 1;
    min-width: 0;
  }

  .room-info strong {
    display: block;
    font-size: 14px;
    overflow-wrap: anywhere;
  }

  .room-info small {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin-top: 5px;
  }

  .join-button {
    border: none;
    background: #f0f2ff;
    color: var(--primary);
    border-radius: 8px;
    padding: 10px 13px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }

  .join-button:hover {
    background: var(--primary);
    color: white;
  }

  /* EMPTY STATE */

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px 20px;
    background: white;
    border: 1px dashed #d8ddea;
    border-radius: 14px;
    color: var(--muted);
  }

  .empty-icon {
    font-size: 30px;
    margin-bottom: 12px;
  }

  .empty-state h3 {
    color: var(--text);
    margin-bottom: 7px;
  }

  /* CHAT PAGE */

  .chat-shell {
    max-width: 850px;
    margin: auto;
    background: white;
    border: 1px solid var(--border);
    border-radius: 17px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .chat-head {
    padding: 25px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
  }

  .back-link {
    color: var(--primary);
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
  }

  .back-link:hover {
    text-decoration: underline;
  }

  .chat-title {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 17px;
  }

  .chat-title h1 {
    font-size: 22px;
    overflow-wrap: anywhere;
  }

  .current-user {
    font-size: 12px;
    margin-top: 3px;
  }

  .current-user strong {
    color: var(--text);
  }

  /* CONNECTION STATUS */

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 20px;
    background: #fff7e6;
    color: #c58b22;
    white-space: nowrap;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  .status.connected {
    background: #e9faf2;
    color: #0e9f6e;
  }

  .status.disconnected {
    background: #fff0f0;
    color: #dc4545;
  }

  /* MESSAGES */

  .messages {
    height: 480px;
    overflow-y: auto;
    padding: 25px 28px;
    background: #fafbfe;
  }

  .message {
    max-width: 80%;
    margin-bottom: 18px;
    padding: 13px 16px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 4px 13px 13px 13px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .025);
    overflow-wrap: anywhere;
  }

  .message-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 7px;
    flex-wrap: wrap;
  }

  .message-meta strong {
    color: var(--primary);
    font-size: 12px;
  }

  .message-meta time {
    color: #9ba3b5;
    font-size: 10px;
  }

  .message p {
    color: #394257;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
  }

  /* MESSAGE COMPOSER */

  .composer {
    display: flex;
    gap: 10px;
    padding: 18px 25px;
    border-top: 1px solid var(--border);
    background: white;
  }

  .composer input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border);
    background: #f8f9fc;
    padding: 14px 16px;
    border-radius: 10px;
    outline: none;
    font-size: 13px;
  }

  .composer input:focus {
    border-color: var(--primary);
    background: white;
  }

  .form-error {
    color: #e05252;
    font-size: 12px;
    padding: 0 25px 12px;
  }

  /* NOTIFICATIONS */

  .notice {
    padding: 13px 16px;
    border-radius: 9px;
    margin-bottom: 15px;
    font-size: 13px;
    background: #e9faf2;
    color: #087b55;
  }

  .notice.error {
    background: #fff0f0;
    color: #c43d3d;
  }

  /* RESPONSIVE DESIGN */

  @media (max-width: 768px) {
    .page {
      margin: 25px auto;
      padding: 0 16px;
    }

    .welcome-card {
      padding: 30px 25px;
    }

    .welcome-decoration {
      display: none;
    }

    .dashboard-head {
      align-items: flex-start;
      flex-direction: column;
    }

    .create-room {
      width: 100%;
    }

    .create-room input {
      flex: 1;
      min-width: 0;
    }

    .room-grid {
      grid-template-columns: 1fr;
    }

    .chat-head {
      padding: 20px;
    }

    .messages {
      height: 55vh;
      padding: 20px 15px;
    }

    .composer {
      padding: 14px;
    }
  }

  @media (max-width: 480px) {
    .topbar-inner {
      padding: 0 16px;
    }

    .nav-label {
      font-size: 9px;
    }

    .welcome-card {
      padding: 28px 20px;
    }

    .welcome-card h1 {
      font-size: 31px;
    }

    .username-form {
      flex-direction: column;
      align-items: stretch;
    }

    .username-form .button {
      width: 100%;
    }

    .create-room {
      flex-wrap: wrap;
    }

    .create-room input {
      width: 100%;
      flex-basis: 100%;
    }

    .create-room .button {
      width: 100%;
    }

    .room-card {
      padding: 14px;
      gap: 10px;
    }

    .chat-title h1 {
      font-size: 18px;
    }

    .chat-head {
      align-items: flex-start;
      flex-direction: column;
    }

    .message {
      max-width: 95%;
    }

    .composer .button {
      padding: 12px;
    }
  }

</style>
</head>
<body>
  {% comment %} <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{% url 'home' %}">
        <span class="brand-icon">#</span>
        Chatroom
      </a>
      <span class="nav-label">REAL-TIME MESSAGING</span>
    </div>
  </header> {% endcomment %}

  <main class="page">
    {% if messages %}
      {% for message in messages %}
        <div class="notice {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
